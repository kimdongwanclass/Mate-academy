<style>
:root{--or:#E8601A;--bk:#111;--wh:#fff;--t2:rgba(255,255,255,.72);--t3:rgba(255,255,255,.5);--ln:rgba(255,255,255,.12)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bk);color:var(--wh);min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 24px}
main{flex:1;display:flex;align-items:center;padding:72px 0 48px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--or);display:flex;align-items:center;gap:10px;margin-bottom:16px}
.eyebrow::before{content:'';width:20px;height:1.5px;background:var(--or)}
h1{font-size:clamp(44px,8vw,84px);font-weight:900;letter-spacing:-.05em;line-height:1;margin-bottom:14px}
h1 span{color:var(--or)}
.lead{font-size:15px;color:var(--t2);line-height:1.8;margin-bottom:44px}
/* 1단계: 학원(목동·김포) — 크게 */
.branches{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.br{position:relative;display:grid;grid-template-columns:auto 1fr;column-gap:26px;align-items:center;background:#1A1A1A;border:1.5px solid var(--ln);border-radius:14px;padding:34px 32px 30px;overflow:hidden;transition:border-color .2s,transform .2s,background .2s}
.br::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.br:hover{border-color:var(--acc-l);background:#1F1F1F;transform:translateY(-3px)}
.br.mok{--acc:#1F7A45;--acc-l:#3FA36A}
.br.gim{--acc:#1E4FB0;--acc-l:#4F7FE0}
.br-mark{width:96px;grid-row:1/4}
.br-mark img{width:100%;height:auto;display:block}
.br-kicker{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.04em}
.br-name{font-size:34px;font-weight:900;letter-spacing:-.04em;line-height:1.2;margin:2px 0 4px}
.br-sub{font-size:14px;font-weight:700;color:var(--or)}
.br-info{grid-column:1/-1;margin-top:22px;padding-top:16px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.br-addr{font-size:13px;color:var(--t3);line-height:1.75}
.br-go{flex-shrink:0;font-size:14px;font-weight:800;color:var(--wh);background:rgba(255,255,255,.08);padding:10px 16px;border-radius:8px;transition:background .2s}
.br:hover .br-go{background:var(--or)}
/* 2단계: 부가 서비스 — 작게 */
.more-lbl{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.06em;margin:34px 0 12px}
.more-lbl::after{content:'';flex:1;height:1px;background:var(--ln)}
.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ex{display:grid;grid-template-columns:34px 1fr auto;column-gap:14px;align-items:center;padding:14px 18px;border:1px solid var(--ln);border-radius:10px;transition:border-color .2s,background .2s}
.ex:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.03)}
.ex-mark{grid-row:1/3;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.ex-mark img{width:100%;height:auto}
.ex-mark svg{width:32px;height:32px}
.ex-name{font-size:15px;font-weight:800;color:var(--t2);align-self:end}
.ex-sub{font-size:12px;color:var(--t3);align-self:start}
.ex-go{grid-column:3;grid-row:1/3;font-size:15px;color:var(--t3);transition:color .2s}
.ex:hover .ex-name,.ex:hover .ex-go{color:var(--wh)}
footer{border-top:1px solid var(--ln);padding:20px 0 24px;font-size:12px;color:var(--t3)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--t2);font-weight:700}
@media(max-width:900px){.br{grid-template-columns:auto 1fr;padding:26px 24px 22px;column-gap:18px}.br-mark{width:72px}.br-name{font-size:28px}.extras{grid-template-columns:1fr}}
@media(max-width:720px){.branches{grid-template-columns:1fr}}
@media(max-width:560px){
  main{padding:36px 0 24px}
  h1{font-size:44px;margin-bottom:8px}.lead{margin-bottom:22px}
  .br{padding:20px 18px 16px;column-gap:16px;border-radius:12px}
  .br:hover{transform:none}
  .br-mark{width:60px}
  .br-name{font-size:24px}
  .br-sub{font-size:13px}
  .br-info{margin-top:14px;padding-top:12px;align-items:center}
  .br-addr{font-size:12px;line-height:1.6}
  .br-go{font-size:13px;padding:8px 12px}
  .more-lbl{margin:24px 0 10px}
  .ex{padding:12px 14px}
}
@media(max-width:820px){main{padding:48px 0 32px}.lead{margin-bottom:28px}}

html{overflow-x:clip}
</style>
</head>
